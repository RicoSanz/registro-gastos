<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Asistencia</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --success: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .main-grid {
      width: 100%;
      max-width: 820px;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .main-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }

    .card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
    }

    /* Visor de Cámara Ajustado */
    #reader {
      width: 100%;
      height: 170px;
      border-radius: 6px;
      overflow: hidden;
      border: 3px solid transparent;
      background: #000;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #reader.flash-success {
      border-color: var(--success) !important;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
    }

    .input-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
    }

    button.btn-search {
      background-color: #475569;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Ficha Alumno Compacta */
    .student-info {
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .student-info div {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }

    .value { font-weight: 700; color: #1e293b; }

    /* Controles de Formulario */
    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
    }

    .btn-save {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }

    .btn-save:hover { background-color: var(--primary-hover); }
    .btn-save:disabled { background-color: #cbd5e1; cursor: not-allowed; }

    .status-msg {
      font-size: 0.8rem;
      margin-top: 4px;
      min-height: 1.1em;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="main-grid">

  <!-- Columna Izquierda: Lector QR -->
  <div class="card">
    <div>
      <h2>Escanear QR</h2>
      <div id="reader"></div>
      
      <div class="input-group">
        <input type="text" id="manualNoLista" placeholder="Clave manual (ej. E0002)">
        <button class="btn-search" onclick="buscarManual()">Buscar</button>
      </div>
    </div>
    <div id="searchStatus" class="status-msg">Cargando base de datos...</div>
  </div>

  <!-- Columna Derecha: Captura de Asistencia -->
  <div class="card">
    <div>
      <h2>Datos del Alumno</h2>
      <div class="student-info">
        <div><span>Clave:</span> <span id="infoNoLista" class="value">-</span></div>
        <div><span>Nombre:</span> <span id="infoNombre" class="value">-</span></div>
        <div><span>Apellidos:</span> <span id="infoApellidos" class="value">-</span></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="estatus">Estatus:</label>
          <select id="estatus">
            <option value="Asistencia">Asistencia</option>
            <option value="Retardo">Retardo</option>
            <option value="Falta">Falta</option>
            <option value="Justificado">Justificado</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tarea">Tarea:</label>
          <select id="tarea">
            <option value="Cumplió">Sí cumplió</option>
            <option value="No entregó">No entregó</option>
            <option value="Incompleta">Incompleta</option>
            <option value="N/A">No aplica</option>
          </select>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 8px;">
        <label for="observaciones">Observaciones:</label>
        <input type="text" id="observaciones" placeholder="Opcional...">
      </div>
    </div>

    <div>
      <button id="btnGuardar" class="btn-save" onclick="guardarRegistro()" disabled>Guardar Asistencia</button>
      <div id="saveStatus" class="status-msg"></div>
    </div>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzm5dVqEwCQsrORdD0_tIONb7jlwSxE5ocyQTwC9vXL28I18E43m2fEdALNPJ5dmmjl/exec";
  
  let alumnosCache = [];
  let alumnoSeleccionado = null;
  let html5QrcodeScanner = null;
  let escaneoBloqueado = false;

  window.onload = function() {
    cargarBaseDeDatos();
    iniciarEscaner();
  };

  function cargarBaseDeDatos() {
    const status = document.getElementById('searchStatus');
    status.innerText = "Cargando lista de alumnos...";
    
    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?action=obtenerTodos&callback=alumnosCargados`;
    document.body.appendChild(script);
  }

  function alumnosCargados(data) {
    const status = document.getElementById('searchStatus');
    if (data && data.alumnos) {
      alumnosCache = data.alumnos;
      status.style.color = "var(--success)";
      status.innerText = "Base de datos lista.";
    } else {
      status.style.color = "#dc2626";
      status.innerText = "Error al cargar la base de datos.";
    }
  }

  function iniciarEscaner() {
    html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { fps: 15, qrbox: { width: 140, height: 140 } },
      /* verbose= */ false
    );
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  }

  function onScanSuccess(decodedText) {
    if (escaneoBloqueado) return;

    const clave = decodedText.trim();
    if (!clave) return;

    destacarCamara();
    if (navigator.vibrate) navigator.vibrate(80);

    procesarBusqueda(clave);
  }

  function onScanFailure(error) {}

  function destacarCamara() {
    const readerEl = document.getElementById('reader');
    readerEl.classList.add('flash-success');
    setTimeout(() => {
      readerEl.classList.remove('flash-success');
    }, 350);
  }

  function buscarManual() {
    const input = document.getElementById('manualNoLista');
    const clave = input.value.trim();
    if (!clave) {
      alert("Por favor ingresa una clave o número válido.");
      return;
    }
    procesarBusqueda(clave);
  }

  function procesarBusqueda(clave) {
    const status = document.getElementById('searchStatus');
    status.style.color = "inherit";
    status.innerText = "Buscando...";

    const claveLimpia = clave.toUpperCase();
    const alumno = alumnosCache.find(a => String(a.noLista).trim().toUpperCase() === claveLimpia);

    if (alumno) {
      alumnoSeleccionado = alumno;
      document.getElementById('infoNoLista').innerText = alumno.noLista;
      document.getElementById('infoNombre').innerText = alumno.nombre;
      document.getElementById('infoApellidos').innerText = alumno.apellidos;
      document.getElementById('btnGuardar').disabled = false;
      status.style.color = "var(--success)";
      status.innerText = "Alumno encontrado.";
    } else {
      limpiarDatosAlumno();
      status.style.color = "#dc2626";
      status.innerText = `Sin registros para: ${clave}`;
    }
  }

  function guardarRegistro() {
    if (!alumnoSeleccionado) return;

    const btn = document.getElementById('btnGuardar');
    const saveStatus = document.getElementById('saveStatus');
    const estatusVal = document.getElementById('estatus').value;
    const tareaVal = document.getElementById('tarea').value;
    const obsVal = document.getElementById('observaciones').value;

    btn.disabled = true;
    saveStatus.style.color = "inherit";
    saveStatus.innerText = "Guardando...";

    escaneoBloqueado = true;

    const script = document.createElement('script');
    const url = `${SCRIPT_URL}?action=guardar&noLista=${encodeURIComponent(alumnoSeleccionado.noLista)}` +
                `&nombre=${encodeURIComponent(alumnoSeleccionado.nombre)}` +
                `&apellidos=${encodeURIComponent(alumnoSeleccionado.apellidos)}` +
                `&estatus=${encodeURIComponent(estatusVal)}` +
                `&tarea=${encodeURIComponent(tareaVal)}` +
                `&observaciones=${encodeURIComponent(obsVal)}` +
                `&callback=registroGuardado`;

    script.src = url;
    document.body.appendChild(script);
  }

  function registroGuardado(response) {
    const saveStatus = document.getElementById('saveStatus');
    const status = document.getElementById('searchStatus');

    if (response && response.exito) {
      saveStatus.style.color = "var(--success)";
      saveStatus.innerText = "¡Guardado!";

      limpiarFormularioCompleto();

      setTimeout(() => {
        saveStatus.innerText = "";
        status.innerText = "Listo para escanear.";
        escaneoBloqueado = false;
      }, 1200);

    } else {
      saveStatus.style.color = "#dc2626";
      saveStatus.innerText = "Error al guardar.";
      document.getElementById('btnGuardar').disabled = false;
      escaneoBloqueado = false;
    }
  }

  function limpiarDatosAlumno() {
    alumnoSeleccionado = null;
    document.getElementById('infoNoLista').innerText = "-";
    document.getElementById('infoNombre').innerText = "-";
    document.getElementById('infoApellidos').innerText = "-";
    document.getElementById('btnGuardar').disabled = true;
  }

  function limpiarFormularioCompleto() {
    limpiarDatosAlumno();
    document.getElementById('manualNoLista').value = "";
    document.getElementById('observaciones').value = "";
    document.getElementById('estatus').value = "Asistencia";
    document.getElementById('tarea').value = "Cumplió";
  }
</script>

</body>
</html>
