<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Asistencia</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .main-grid {
      width: 100%;
      max-width: 820px;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .main-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }

    .card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    h2 {
      margin: 0;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
    }

    .btn-cam {
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fca5a5;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-cam.off {
      background: #e2e8f0;
      color: #334155;
      border-color: var(--border);
    }

    /* Contenedor Limpio sin deformación CSS */
    .scanner-wrapper {
      position: relative;
      width: 100%;
      min-height: 220px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #reader {
      width: 100%;
    }

    /* Asegurar alineación directa de video sin desfasar coordenadas */
    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 6px;
    }

    .input-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
    }

    button.btn-search {
      background-color: #475569;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .student-info {
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .student-info div {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }

    .value { font-weight: 700; color: #1e293b; }

    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
    }

    .btn-save {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }

    .btn-save:hover { background-color: var(--primary-hover); }
    .btn-save:disabled { background-color: #cbd5e1; cursor: not-allowed; }

    .status-msg {
      font-size: 0.8rem;
      margin-top: 4px;
      min-height: 1.1em;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="main-grid">

  <!-- Columna Izquierda: Escáner QR -->
  <div class="card">
    <div>
      <div class="card-header">
        <h2>Escanear QR</h2>
        <button id="btnCamara" class="btn-cam" onclick="toggleCamara()">Apagar Cámara</button>
      </div>
      
      <div id="scannerWrapper" class="scanner-wrapper">
        <div id="reader"></div>
      </div>
      
      <div class="input-group">
        <input type="text" id="manualNoLista" placeholder="Clave manual (ej. E0002)">
        <button class="btn-search" onclick="buscarManual()">Buscar</button>
      </div>
    </div>
    <div id="searchStatus" class="status-msg">Cargando base de datos...</div>
  </div>

  <!-- Columna Derecha: Registro -->
  <div class="card">
    <div>
      <h2>Datos del Alumno</h2>
      <div class="student-info">
        <div><span>Clave:</span> <span id="infoNoLista" class="value">-</span></div>
        <div><span>Nombre:</span> <span id="infoNombre" class="value">-</span></div>
        <div><span>Apellidos:</span> <span id="infoApellidos" class="value">-</span></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="estatus">Estatus:</label>
          <select id="estatus">
            <option value="Asistencia">Asistencia</option>
            <option value="Retardo">Retardo</option>
            <option value="Falta">Falta</option>
            <option value="Justificado">Justificado</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tarea">Tarea:</label>
          <select id="tarea">
            <option value="Cumplió">Sí cumplió</option>
            <option value="No entregó">No entregó</option>
            <option value="Incompleta">Incompleta</option>
            <option value="N/A">No aplica</option>
          </select>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 8px;">
        <label for="observaciones">Observaciones:</label>
        <input type="text" id="observaciones" placeholder="Opcional...">
      </div>
    </div>

    <div>
      <button id="btnGuardar" class="btn-save" onclick="guardarRegistro()" disabled>Guardar Asistencia</button>
      <div id="saveStatus" class="status-msg"></div>
    </div>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzm5dVqEwCQsrORdD0_tIONb7jlwSxE5ocyQTwC9vXL28I18E43m2fEdALNPJ5dmmjl/exec";
  
  let alumnosCache = [];
  let alumnoSeleccionado = null;
  let html5QrCode = null;
  let camaraActiva = false;
  let enPausa = false;

  window.onload = function() {
    cargarBaseDeDatos();
    iniciarEscaner();
  };

  function cargarBaseDeDatos() {
    const status = document.getElementById('searchStatus');
    status.innerText = "Cargando lista de alumnos...";
    
    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?action=obtenerTodos&callback=alumnosCargados`;
    document.body.appendChild(script);
  }

  function alumnosCargados(data) {
    const status = document.getElementById('searchStatus');
    if (data && data.alumnos) {
      alumnosCache = data.alumnos;
      status.style.color = "var(--success)";
      status.innerText = "Base de datos lista.";
    } else {
      status.style.color = "var(--danger)";
      status.innerText = "Error al cargar la base de datos.";
    }
  }

  function iniciarEscaner() {
    if (html5QrCode && html5QrCode.isScanning) return;

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    const config = { 
      fps: 10,
      qrbox: { width: 180, height: 180 },
      aspectRatio: 1.0
    };

    html5QrCode.start(
      { facingMode: "environment" }, 
      config, 
      onScanSuccess, 
      onScanFailure
    ).then(() => {
      camaraActiva = true;
      enPausa = false;
      actualizarBotonCamara();
    }).catch(err => {
      console.error("Error al iniciar cámara:", err);
      camaraActiva = false;
      actualizarBotonCamara();
    });
  }

  function detenerEscaner() {
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(() => {
        camaraActiva = false;
        enPausa = false;
        actualizarBotonCamara();
      }).catch(err => console.error(err));
    }
  }

  function toggleCamara() {
    if (camaraActiva) {
      detenerEscaner();
    } else {
      iniciarEscaner();
    }
  }

  function actualizarBotonCamara() {
    const btn = document.getElementById('btnCamara');
    if (camaraActiva) {
      btn.innerText = "Apagar Cámara";
      btn.classList.remove('off');
    } else {
      btn.innerText = "Encender Cámara";
      btn.classList.add('off');
    }
  }

  function onScanSuccess(decodedText) {
    if (enPausa) return;

    const clave = decodedText.trim();
    if (!clave) return;

    // Pausamos inmediatamente el procesamiento de video para no congelar la cámara
    if (html5QrCode && html5QrCode.getState() === 2) { // 2 = SCANNING
      html5QrCode.pause(true); // Pausa la decodificación y congela la vista
      enPausa = true;
    }

    if (navigator.vibrate) navigator.vibrate(80);

    procesarBusqueda(clave);
  }

  function onScanFailure(error) {}

  function reanudarEscaner() {
    if (html5QrCode && enPausa) {
      try {
        html5QrCode.resume();
        enPausa = false;
      } catch (e) {
        console.warn("No se pudo reanudar directamente, reiniciando...", e);
        html5QrCode.stop().then(() => iniciarEscaner());
      }
    }
  }

  function buscarManual() {
    const input = document.getElementById('manualNoLista');
    const clave = input.value.trim();
    if (!clave) {
      alert("Por favor ingresa una clave o número válido.");
      return;
    }
    procesarBusqueda(clave);
  }

  function procesarBusqueda(clave) {
    const status = document.getElementById('searchStatus');
    status.style.color = "inherit";
    status.innerText = "Buscando...";

    const claveLimpia = clave.toUpperCase();
    const alumno = alumnosCache.find(a => String(a.noLista).trim().toUpperCase() === claveLimpia);

    if (alumno) {
      alumnoSeleccionado = alumno;
      document.getElementById('infoNoLista').innerText = alumno.noLista;
      document.getElementById('infoNombre').innerText = alumno.nombre;
      document.getElementById('infoApellidos').innerText = alumno.apellidos;
      document.getElementById('btnGuardar').disabled = false;
      status.style.color = "var(--success)";
      status.innerText = "Alumno encontrado.";
    } else {
      limpiarDatosAlumno();
      status.style.color = "var(--danger)";
      status.innerText = `Sin registros para: ${clave}`;
      
      // Si la búsqueda no arroja resultados, reanudamos el escáner tras 1.5 segundos
      setTimeout(() => {
        status.innerText = "Listo para escanear.";
        status.style.color = "inherit";
        reanudarEscaner();
      }, 1500);
    }
  }

  function guardarRegistro() {
    if (!alumnoSeleccionado) return;

    const btn = document.getElementById('btnGuardar');
    const saveStatus = document.getElementById('saveStatus');
    const estatusVal = document.getElementById('estatus').value;
    const tareaVal = document.getElementById('tarea').value;
    const obsVal = document.getElementById('observaciones').value;

    btn.disabled = true;
    saveStatus.style.color = "inherit";
    saveStatus.innerText = "Guardando...";

    const script = document.createElement('script');
    const url = `${SCRIPT_URL}?action=guardar&noLista=${encodeURIComponent(alumnoSeleccionado.noLista)}` +
                `&nombre=${encodeURIComponent(alumnoSeleccionado.nombre)}` +
                `&apellidos=${encodeURIComponent(alumnoSeleccionado.apellidos)}` +
                `&estatus=${encodeURIComponent(estatusVal)}` +
                `&tarea=${encodeURIComponent(tareaVal)}` +
                `&observaciones=${encodeURIComponent(obsVal)}` +
                `&callback=registroGuardado`;

    script.src = url;
    document.body.appendChild(script);
  }

  function registroGuardado(response) {
    const saveStatus = document.getElementById('saveStatus');
    const status = document.getElementById('searchStatus');

    if (response && response.exito) {
      saveStatus.style.color = "var(--success)";
      saveStatus.innerText = "¡Guardado con éxito!";

      limpiarFormularioCompleto();

      setTimeout(() => {
        saveStatus.innerText = "";
        status.innerText = "Listo para escanear.";
        status.style.color = "inherit";
        reanudarEscaner(); // Reanuda la lectura limpia tras guardar
      }, 1000);

    } else {
      saveStatus.style.color = "var(--danger)";
      saveStatus.innerText = "Error al guardar.";
      document.getElementById('btnGuardar').disabled = false;
    }
  }

  function limpiarDatosAlumno() {
    alumnoSeleccionado = null;
    document.getElementById('infoNoLista').innerText = "-";
    document.getElementById('infoNombre').innerText = "-";
    document.getElementById('infoApellidos').innerText = "-";
    document.getElementById('btnGuardar').disabled = true;
  }

  function limpiarFormularioCompleto() {
    limpiarDatosAlumno();
    document.getElementById('manualNoLista').value = "";
    document.getElementById('observaciones').value = "";
    document.getElementById('estatus').value = "Asistencia";
    document.getElementById('tarea').value = "Cumplió";
  }
</script>

</body>
</html>
