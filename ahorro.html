<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Ahorro</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --btn-bg: #f1f5f9;
      --btn-active: #2563eb;
      --btn-active-text: #ffffff;
      --accent: #10b981;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --border: #334155;
      --btn-bg: #334155;
      --btn-active: #3b82f6;
      --btn-active-text: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 8px;
      font-size: 13px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .header h2 { font-size: 1.1rem; font-weight: 700; }

    .theme-toggle {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .form-group { margin-bottom: 8px; }
    .label { font-weight: 600; margin-bottom: 4px; display: block; font-size: 11px; text-transform: uppercase; color: var(--text); opacity: 0.8; }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: start;
    }

    .periodo-container {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .periodo-toggle {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }
    .periodo-toggle label { display: flex; align-items: center; gap: 2px; cursor: pointer; }

    select, input[type="number"], input[type="date"], input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    /* Grids de Botones */
    .btn-grid {
      display: grid;
      gap: 4px;
    }

    .grid-apartados {
      grid-template-columns: repeat(3, 1fr);
      max-height: 285px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .grid-cuentas {
      grid-template-columns: repeat(6, 1fr);
      width: 100%;
    }

    .grid-tipo {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 2px;
      border-radius: 5px;
      font-size: 10.5px;
      cursor: pointer;
      text-align: center;
      white-space: normal;
      word-wrap: break-word;
      line-height: 1.1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      user-select: none;
    }

    .grid-btn.selected {
      background: var(--btn-active);
      color: var(--btn-active-text);
      border-color: var(--btn-active);
      font-weight: 600;
    }

    /* Radios de Comentario */
    .radio-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .submit-btn:hover { background: var(--primary-hover); }

    #status { font-size: 11px; text-align: center; margin-top: 6px; font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Registro de Ahorro</h2>
    <button type="button" class="theme-toggle" onclick="toggleTheme()">🌗 Tema</button>
  </div>

  <form id="ahorroForm">
    <!-- FILA 1: PERIODO Y FECHA -->
    <div class="row-2">
      <div class="form-group">
        <span class="label">Periodo</span>
        <div class="periodo-container">
          <div class="periodo-toggle">
            <label><input type="radio" name="tipoPeriodo" value="INT" onchange="actualizarPeriodoUI()"> INT</label>
            <label><input type="radio" name="tipoPeriodo" value="LISTA" checked onchange="actualizarPeriodoUI()"> Lista</label>
          </div>
          <select id="periodoSelect" style="flex: 1;"></select>
        </div>
      </div>
      <div class="form-group">
        <span class="label">Fecha</span>
        <input type="date" id="fecha" required>
      </div>
    </div>

    <!-- FILA 2: APARTADO -->
    <div class="form-group">
      <span class="label">Apartado</span>
      <div class="btn-grid grid-apartados" id="apartadoGrid"></div>
    </div>

    <!-- FILA 3: CUENTAS -->
    <div class="form-group">
      <span class="label">Cuenta</span>
      <div class="btn-grid grid-cuentas" id="cuentaGrid"></div>
    </div>

    <!-- FILA 4: CANTIDAD Y TIPO -->
    <div class="row-2">
      <div class="form-group">
        <span class="label">Tipo</span>
        <div class="btn-grid grid-tipo" id="tipoGrid"></div>
      </div>
      <div class="form-group">
        <span class="label">Cantidad ($)</span>
        <input type="number" id="cantidad" step="0.01" min="0.01" placeholder="0.00" required>
      </div>
    </div>

    <!-- FILA 5: COMENTARIO -->
    <div class="form-group">
      <span class="label">Comentario (Opcional)</span>
      <div class="radio-group">
        <label><input type="radio" name="comentarioOpt" value="" checked onclick="toggleOtroTexto(false)"> Ninguno</label>
        <label><input type="radio" name="comentarioOpt" value="Intereses" onclick="toggleOtroTexto(false)"> Intereses</label>
        <label><input type="radio" name="comentarioOpt" value="Transferencia" onclick="toggleOtroTexto(false)"> Transferencia</label>
        <label><input type="radio" name="comentarioOpt" value="Otros" onclick="toggleOtroTexto(true)"> Otros</label>
      </div>
      <input type="text" id="comentarioOtro" placeholder="Escribe un comentario breve..." style="display: none;">
    </div>

    <button type="submit" class="submit-btn" id="btnGuardar">Guardar Ahorro</button>
    <div id="status"></div>
  </form>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzRvv34XfLyIfxy4tnE-zCZqxpLPlWAx_-VxO2D__KWCAlrMBgECetdfwqXGRv-JPxHtQ/exec";

  const APARTADOS = [
    "Agua", "Ahorro", "Ahorro Pablito", "Ahorro Rikis", "Alimento Nena", "Apoyo hermanas",
    "Bebbia", "Beca Pablito", "Cetina Rikis", "Cripto monedas", "Diezmo Pablito", "Diezmo Rikis",
    "Escuela", "Gas", "Mantenimiento", "Pago LikeU", "Pago MP", "Personal y Hogar",
    "Prima Seguro", "Ropa & accesorios niños", "Ropa & accesorios papás", "Servicios/Refacciones", "Viajes", "Otros"
  ];

  const CUENTAS = ["BC", "CT", "DD", "EF", "ET", "MD", "MP", "NB", "NU", "OP", "RV", "ST"];
  const TIPOS = ["Retiro", "Abono"];

  const rangosPeriodos = [
    { id: 1, inicio: '2026-01-09', fin: '2026-01-22' },
    { id: 2, inicio: '2026-01-23', fin: '2026-02-05' },
    { id: 3, inicio: '2026-02-06', fin: '2026-02-19' },
    { id: 4, inicio: '2026-02-20', fin: '2026-03-05' },
    { id: 5, inicio: '2026-03-06', fin: '2026-03-19' },
    { id: 6, inicio: '2026-03-20', fin: '2026-04-02' },
    { id: 7, inicio: '2026-04-03', fin: '2026-04-16' },
    { id: 8, inicio: '2026-04-17', fin: '2026-04-30' },
    { id: 9, inicio: '2026-04-30', fin: '2026-05-13' },
    { id: 10, inicio: '2026-05-14', fin: '2026-05-27' },
    { id: 11, inicio: '2026-05-28', fin: '2026-06-10' },
    { id: 12, inicio: '2026-06-11', fin: '2026-06-24' },
    { id: 13, inicio: '2026-06-25', fin: '2026-07-08' },
    { id: 14, inicio: '2026-07-09', fin: '2026-07-22' },
    { id: 15, inicio: '2026-07-23', fin: '2026-08-05' },
    { id: 16, inicio: '2026-08-06', fin: '2026-08-19' },
    { id: 17, inicio: '2026-08-20', fin: '2026-09-02' },
    { id: 18, inicio: '2026-09-03', fin: '2026-09-16' },
    { id: 19, inicio: '2026-09-17', fin: '2026-09-30' },
    { id: 20, inicio: '2026-10-01', fin: '2026-10-14' },
    { id: 21, inicio: '2026-10-15', fin: '2026-10-28' },
    { id: 22, inicio: '2026-10-29', fin: '2026-11-11' },
    { id: 23, inicio: '2026-11-12', fin: '2026-11-25' },
    { id: 24, inicio: '2026-11-26', fin: '2026-12-09' },
    { id: 25, inicio: '2026-12-10', fin: '2026-12-23' },
    { id: 26, inicio: '2026-12-24', fin: '2027-01-06' }
  ];

  let selectedApartado = "";
  let selectedCuenta = "";
  let selectedTipo = "";

  document.addEventListener("DOMContentLoaded", () => {
    initTheme();
    renderGrids();
    initFecha();
  });

  // Control de Tema Persistente (localStorage)
  function initTheme() {
    const savedTheme = localStorage.getItem("appTheme");
    if (savedTheme === "dark") {
      document.body.setAttribute("data-theme", "dark");
    } else {
      document.body.removeAttribute("data-theme");
    }
  }

  function toggleTheme() {
    const currentTheme = document.body.getAttribute("data-theme");
    if (currentTheme === "dark") {
      document.body.removeAttribute("data-theme");
      localStorage.setItem("appTheme", "light");
    } else {
      document.body.setAttribute("data-theme", "dark");
      localStorage.setItem("appTheme", "dark");
    }
  }

  function renderGrids() {
    const apGrid = document.getElementById("apartadoGrid");
    APARTADOS.forEach(ap => {
      const btn = document.createElement("div");
      btn.className = "grid-btn";
      btn.innerText = ap;
      btn.onclick = () => {
        document.querySelectorAll("#apartadoGrid .grid-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedApartado = ap;
      };
      apGrid.appendChild(btn);
    });

    const ctaGrid = document.getElementById("cuentaGrid");
    CUENTAS.forEach(cta => {
      const btn = document.createElement("div");
      btn.className = "grid-btn";
      btn.innerText = cta;
      btn.onclick = () => {
        document.querySelectorAll("#cuentaGrid .grid-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedCuenta = cta;
      };
      ctaGrid.appendChild(btn);
    });

    const tpGrid = document.getElementById("tipoGrid");
    TIPOS.forEach(tp => {
      const btn = document.createElement("div");
      btn.className = "grid-btn";
      btn.innerText = tp;
      btn.onclick = () => {
        document.querySelectorAll("#tipoGrid .grid-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedTipo = tp;
      };
      tpGrid.appendChild(btn);
    });
  }

  function initFecha() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    
    const localDate = `${year}-${month}-${day}`;
    const fechaInput = document.getElementById("fecha");
    
    fechaInput.value = localDate;
    generarPeriodosNumericos();

    fechaInput.addEventListener("change", () => {
      generarPeriodosNumericos();
    });
  }

  function generarPeriodosNumericos() {
    const select = document.getElementById("periodoSelect");
    const fechaSeleccionada = document.getElementById("fecha").value;
    
    if (!fechaSeleccionada) return;

    let periodoEncontrado = 1;
    for (const rango of rangosPeriodos) {
      if (fechaSeleccionada >= rango.inicio && fechaSeleccionada <= rango.fin) {
        periodoEncontrado = rango.id;
        break;
      }
    }

    select.innerHTML = "";
    for (let i = 1; i <= 26; i++) {
      const option = document.createElement("option");
      option.value = i.toString();
      option.text = i.toString();
      select.appendChild(option);
    }
    
    select.value = periodoEncontrado.toString();
  }

  function actualizarPeriodoUI() {
    const tipo = document.querySelector('input[name="tipoPeriodo"]:checked').value;
    const select = document.getElementById("periodoSelect");
    select.style.display = (tipo === "INT") ? "none" : "block";
  }

  function toggleOtroTexto(show) {
    const txt = document.getElementById("comentarioOtro");
    txt.style.display = show ? "block" : "none";
    if (!show) txt.value = "";
  }

  document.getElementById("ahorroForm").addEventListener("submit", function(e) {
    e.preventDefault();

    if (!selectedApartado) { alert("Por favor selecciona un Apartado."); return; }
    if (!selectedCuenta) { alert("Por favor selecciona una Cuenta."); return; }
    if (!selectedTipo) { alert("Por favor selecciona un Tipo (Retiro/Abono)."); return; }

    const tipoPeriodo = document.querySelector('input[name="tipoPeriodo"]:checked').value;
    const periodoVal = tipoPeriodo === "INT" ? "INT" : document.getElementById("periodoSelect").value;

    const comRadio = document.querySelector('input[name="comentarioOpt"]:checked').value;
    let comentarioVal = comRadio;
    if (comRadio === "Otros") {
      comentarioVal = document.getElementById("comentarioOtro").value.trim();
    }

    const cantidadVal = parseFloat(document.getElementById("cantidad").value);

    const payload = {
      tipoFormulario: "Ahorro",
      periodo: periodoVal,
      apartado: selectedApartado,
      cuenta: selectedCuenta,
      tipo: selectedTipo,
      cantidad: cantidadVal,
      comentario: comentarioVal
    };

    const statusDiv = document.getElementById("status");
    const btnGuardar = document.getElementById("btnGuardar");

    statusDiv.style.color = "var(--text)";
    statusDiv.innerText = "Guardando en Google Sheets...";
    btnGuardar.disabled = true;

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      statusDiv.style.color = "var(--accent)";
      statusDiv.innerText = "¡Registro guardado con éxito!";
      
      document.getElementById("cantidad").value = "";
      document.getElementById("comentarioOtro").value = "";
      document.querySelectorAll(".grid-btn").forEach(b => b.classList.remove("selected"));
      selectedApartado = "";
      selectedCuenta = "";
      selectedTipo = "";
      btnGuardar.disabled = false;
      setTimeout(() => { statusDiv.innerText = ""; }, 3000);
    })
    .catch(err => {
      console.error(err);
      statusDiv.style.color = "red";
      statusDiv.innerText = "Error al guardar. Intenta de nuevo.";
      btnGuardar.disabled = false;
    });
  });
</script>

</body>
</html>
